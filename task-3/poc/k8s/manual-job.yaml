apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-clients-export-manual
  namespace: analytics-export
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: exporter
          image: logistics-analytics-export:clients
          imagePullPolicy: Never
          volumeMounts:
            - name: export-storage
              mountPath: /exports
      volumes:
        - name: export-storage
          persistentVolumeClaim:
            claimName: analytics-export-pvc
