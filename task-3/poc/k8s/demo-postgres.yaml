apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: analytics-export
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS clients (
      id BIGSERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      email VARCHAR(255) NOT NULL,
      phone VARCHAR(32) NOT NULL,
      company_name VARCHAR(255) NOT NULL,
      created_at TIMESTAMP NOT NULL
    );

    INSERT INTO clients (name, email, phone, company_name, created_at)
    VALUES
      ('Ivan Petrov', 'ivan.petrov@example.com', '+79990000001', 'Logistika Plus', NOW() - INTERVAL '10 day'),
      ('Anna Smirnova', 'anna.smirnova@example.com', '+79990000002', 'Cargo Trade', NOW() - INTERVAL '8 day'),
      ('Pavel Sidorov', 'pavel.sidorov@example.com', '+79990000003', 'Trans Group', NOW() - INTERVAL '5 day')
    ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: analytics-export
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: analytics-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: logistics
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: analytics-export
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
